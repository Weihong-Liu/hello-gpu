<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 424" role="img">
<title>一个行动的闭环：提出、执行、观察，再决定下一步</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#497789"/></marker></defs>
<rect width="1240" height="424" fill="#f8faf9"/>
<text x="24" y="40" font-family="sans-serif" font-size="25" fill="#173d4e" text-anchor="start" font-weight="normal">一个行动的闭环：提出、执行、观察，再决定下一步</text>
<text x="24" y="74" font-family="sans-serif" font-size="18" fill="#445a62" text-anchor="start" font-weight="normal">先手动提出一个行动，观察实际反馈；后续再让模型承担提出行动的工作。</text>
<rect x="24" y="110" width="277" height="180" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="42" y="151" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="start" font-weight="bold">提出行动</text>
<text x="42" y="208" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">工具名 + 参数</text>
<text x="42" y="251" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">手写或由模型提出</text>
<line x1="306" y1="197" x2="323" y2="197" stroke="#497789" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="329" y="110" width="277" height="180" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="347" y="151" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="start" font-weight="bold">执行工具</text>
<text x="347" y="208" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">ToolExecutor 派发</text>
<text x="347" y="251" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">实际运行对应函数</text>
<line x1="611" y1="197" x2="628" y2="197" stroke="#497789" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="634" y="110" width="277" height="180" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="652" y="151" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="start" font-weight="bold">得到观察</text>
<text x="652" y="208" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">成功／失败 + 执行结果</text>
<text x="652" y="251" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">写入历史记录</text>
<line x1="916" y1="197" x2="933" y2="197" stroke="#497789" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="939" y="110" width="277" height="180" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="957" y="151" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="start" font-weight="bold">选择下一步</text>
<text x="957" y="208" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">依据反馈修改方案</text>
<text x="957" y="251" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">继续调用或停止</text>
<path d="M 1078 300 V 338 H 163 V 300" fill="none" stroke="#497789" stroke-width="2" marker-end="url(#arrow)"/>
<text x="620" y="326" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="middle" font-weight="normal">把观察作为下一次提出行动的依据</text>
<text x="24" y="395" font-family="sans-serif" font-size="19" fill="#445a62" text-anchor="start" font-weight="normal">模型负责提出行动；kernel 的正确性与耗时，来自工具的真实执行。</text>
</svg>
