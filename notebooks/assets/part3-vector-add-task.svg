<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 480" role="img">
<title>从一对输入到一个输出：FP16 向量加法</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#497789"/></marker></defs>
<rect width="1240" height="480" fill="#f8faf9"/>
<text x="24" y="40" font-family="sans-serif" font-size="25" fill="#173d4e" text-anchor="start" font-weight="normal">从一对输入到一个输出：FP16 向量加法</text>
<text x="24" y="72" font-family="sans-serif" font-size="17" fill="#445a62" text-anchor="start" font-weight="normal">手算例子：每个位置执行 z[i] = x[i] + y[i]。下面的数组只用于解释任务。</text>
<rect x="24" y="110" width="442" height="76" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="48" y="157" font-family="sans-serif" font-size="24" fill="#173d4e" text-anchor="start" font-weight="bold">x</text>
<rect x="112" y="123" width="64" height="50" rx="9" fill="#f8faf9" stroke="#497789" stroke-width="1.5"/>
<text x="144" y="157" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="middle" font-weight="normal">1</text>
<rect x="194" y="123" width="64" height="50" rx="9" fill="#f8faf9" stroke="#497789" stroke-width="1.5"/>
<text x="226" y="157" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="middle" font-weight="normal">2</text>
<rect x="276" y="123" width="64" height="50" rx="9" fill="#f8faf9" stroke="#497789" stroke-width="1.5"/>
<text x="308" y="157" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="middle" font-weight="normal">3</text>
<rect x="358" y="123" width="64" height="50" rx="9" fill="#f8faf9" stroke="#497789" stroke-width="1.5"/>
<text x="390" y="157" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="middle" font-weight="normal">4</text>
<rect x="24" y="210" width="442" height="76" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="48" y="257" font-family="sans-serif" font-size="24" fill="#173d4e" text-anchor="start" font-weight="bold">y</text>
<rect x="112" y="223" width="64" height="50" rx="9" fill="#f8faf9" stroke="#497789" stroke-width="1.5"/>
<text x="144" y="257" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="middle" font-weight="normal">10</text>
<rect x="194" y="223" width="64" height="50" rx="9" fill="#f8faf9" stroke="#497789" stroke-width="1.5"/>
<text x="226" y="257" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="middle" font-weight="normal">20</text>
<rect x="276" y="223" width="64" height="50" rx="9" fill="#f8faf9" stroke="#497789" stroke-width="1.5"/>
<text x="308" y="257" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="middle" font-weight="normal">30</text>
<rect x="358" y="223" width="64" height="50" rx="9" fill="#f8faf9" stroke="#497789" stroke-width="1.5"/>
<text x="390" y="257" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="middle" font-weight="normal">40</text>
<rect x="536" y="123" width="154" height="150" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="613" y="165" font-family="sans-serif" font-size="21" fill="#173d4e" text-anchor="middle" font-weight="normal">同一位置</text>
<text x="613" y="225" font-family="sans-serif" font-size="48" fill="#173d4e" text-anchor="middle" font-weight="normal">+</text>
<line x1="474" y1="148" x2="529" y2="164" stroke="#497789" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="474" y1="248" x2="529" y2="231" stroke="#497789" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="698" y1="198" x2="757" y2="198" stroke="#497789" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="768" y="123" width="448" height="150" rx="9" fill="#fff0db" stroke="#ad782e" stroke-width="1.5"/>
<text x="790" y="161" font-family="sans-serif" font-size="22" fill="#173d4e" text-anchor="start" font-weight="bold">输出 z</text>
<rect x="804" y="184" width="76" height="54" rx="9" fill="#f8faf9" stroke="#ad782e" stroke-width="1.5"/>
<text x="842" y="220" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="middle" font-weight="normal">11</text>
<rect x="900" y="184" width="76" height="54" rx="9" fill="#f8faf9" stroke="#ad782e" stroke-width="1.5"/>
<text x="938" y="220" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="middle" font-weight="normal">22</text>
<rect x="996" y="184" width="76" height="54" rx="9" fill="#f8faf9" stroke="#ad782e" stroke-width="1.5"/>
<text x="1034" y="220" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="middle" font-weight="normal">33</text>
<rect x="1092" y="184" width="76" height="54" rx="9" fill="#f8faf9" stroke="#ad782e" stroke-width="1.5"/>
<text x="1130" y="220" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="middle" font-weight="normal">44</text>
<rect x="24" y="312" width="372" height="88" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="44" y="343" font-family="sans-serif" font-size="20" fill="#173d4e" text-anchor="start" font-weight="bold">读两份输入</text>
<text x="44" y="377" font-family="sans-serif" font-size="22" fill="#173d4e" text-anchor="start" font-weight="normal">2 × 2 B = 4 B</text>
<rect x="434" y="312" width="372" height="88" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="454" y="343" font-family="sans-serif" font-size="20" fill="#173d4e" text-anchor="start" font-weight="bold">做一次加法</text>
<text x="454" y="377" font-family="sans-serif" font-size="22" fill="#173d4e" text-anchor="start" font-weight="normal">1 FLOP / 元素</text>
<rect x="844" y="312" width="372" height="88" rx="9" fill="#fff0db" stroke="#ad782e" stroke-width="1.5"/>
<text x="864" y="343" font-family="sans-serif" font-size="20" fill="#173d4e" text-anchor="start" font-weight="bold">写一份输出</text>
<text x="864" y="377" font-family="sans-serif" font-size="22" fill="#173d4e" text-anchor="start" font-weight="normal">1 × 2 B = 2 B</text>
<text x="24" y="437" font-family="sans-serif" font-size="21" fill="#173d4e" text-anchor="start" font-weight="bold">逻辑算术强度 AI = 1 / (4 + 2) = 1/6 FLOP/B</text>
<text x="24" y="467" font-family="sans-serif" font-size="17" fill="#445a62" text-anchor="start" font-weight="normal">逻辑读写量不等于实测显存流量；缓存与物理事务需要另外测量。</text>
</svg>
