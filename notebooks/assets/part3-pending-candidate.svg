<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 472" role="img">
<title>一轮候选的交接：测过的源码才能进入本轮接受判定</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#497789"/></marker></defs>
<rect width="1240" height="472" fill="#f8faf9"/>
<text x="24" y="40" font-family="sans-serif" font-size="25" fill="#173d4e" text-anchor="start" font-weight="normal">一轮候选的交接：测过的源码才能进入本轮接受判定</text>
<text x="24" y="74" font-family="sans-serif" font-size="17" fill="#445a62" text-anchor="start" font-weight="normal">协议示意：A、B 是两份不同源码；示意不预设 A 的性能，也不保证最终接受。</text>
<rect x="24" y="108" width="277" height="230" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="41" y="147" font-family="sans-serif" font-size="21" fill="#173d4e" text-anchor="start" font-weight="bold">1  检查 A</text>
<text x="41" y="198" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">通过正确性检查</text>
<text x="41" y="245" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">才继续计时</text>
<text x="41" y="292" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">失败时先修复源码</text>
<line x1="306" y1="222" x2="323" y2="222" stroke="#497789" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="329" y="108" width="277" height="230" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="346" y="147" font-family="sans-serif" font-size="21" fill="#173d4e" text-anchor="start" font-weight="bold">2  计时 A</text>
<text x="346" y="198" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">保存 A 的测量</text>
<text x="346" y="245" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">pending = A</text>
<text x="346" y="292" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">当前实现暂不更新</text>
<line x1="611" y1="222" x2="628" y2="222" stroke="#497789" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="634" y="108" width="277" height="230" rx="9" fill="#fff0db" stroke="#ad782e" stroke-width="1.5"/>
<text x="651" y="147" font-family="sans-serif" font-size="21" fill="#173d4e" text-anchor="start" font-weight="bold">3  尝试接受 B</text>
<text x="651" y="198" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">B 不是待判定的 A</text>
<text x="651" y="245" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">Agent 协议拒绝</text>
<text x="651" y="292" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">pending 仍是 A</text>
<line x1="916" y1="222" x2="933" y2="222" stroke="#497789" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="939" y="108" width="277" height="230" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="956" y="147" font-family="sans-serif" font-size="21" fill="#173d4e" text-anchor="start" font-weight="bold">4  对 A 完成判定</text>
<text x="956" y="198" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">独立配对复测</text>
<text x="956" y="245" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">满足条件：更新当前</text>
<text x="956" y="292" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">未满足条件：保持当前</text>
<text x="24" y="381" font-family="sans-serif" font-size="21" fill="#173d4e" text-anchor="start" font-weight="bold">有计时结果 ≠ 已接受；对 A 完成判定后，才结束这一轮交接。</text>
<text x="24" y="421" font-family="sans-serif" font-size="18" fill="#445a62" text-anchor="start" font-weight="normal">正确性失败、源码交接的协议拒绝、性能判定未接受，属于不同阶段。</text>
<text x="24" y="456" font-family="sans-serif" font-size="17" fill="#445a62" text-anchor="start" font-weight="normal">学习者运行时看到的状态和接受结果，以实际记录为准。</text>
</svg>
