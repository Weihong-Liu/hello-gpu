<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 504" role="img">
<title>Triton 的尾部 mask：只读写有效的逻辑位置</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#497789"/></marker></defs>
<rect width="1240" height="504" fill="#f8faf9"/>
<text x="24" y="40" font-family="sans-serif" font-size="25" fill="#173d4e" text-anchor="start" font-weight="normal">Triton 的尾部 mask：只读写有效的逻辑位置</text>
<text x="24" y="74" font-family="sans-serif" font-size="18" fill="#445a62" text-anchor="start" font-weight="normal">手算例子：n = 10，BLOCK = 4，启动 ceil(10 / 4) = 3 个 program。</text>
<rect x="24" y="104" width="372" height="258" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="44" y="139" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="start" font-weight="bold">program 0</text>
<text x="44" y="174" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">offsets = 0 + [0, 1, 2, 3]</text>
<rect x="44" y="194" width="70" height="58" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="79" y="233" font-family="sans-serif" font-size="27" fill="#173d4e" text-anchor="middle" font-weight="normal">0</text>
<text x="79" y="282" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="middle" font-weight="normal">True</text>
<rect x="128" y="194" width="70" height="58" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="163" y="233" font-family="sans-serif" font-size="27" fill="#173d4e" text-anchor="middle" font-weight="normal">1</text>
<text x="163" y="282" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="middle" font-weight="normal">True</text>
<rect x="212" y="194" width="70" height="58" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="247" y="233" font-family="sans-serif" font-size="27" fill="#173d4e" text-anchor="middle" font-weight="normal">2</text>
<text x="247" y="282" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="middle" font-weight="normal">True</text>
<rect x="296" y="194" width="70" height="58" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="331" y="233" font-family="sans-serif" font-size="27" fill="#173d4e" text-anchor="middle" font-weight="normal">3</text>
<text x="331" y="282" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="middle" font-weight="normal">True</text>
<text x="44" y="324" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">全部有效</text>
<rect x="434" y="104" width="372" height="258" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="454" y="139" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="start" font-weight="bold">program 1</text>
<text x="454" y="174" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">offsets = 4 + [0, 1, 2, 3]</text>
<rect x="454" y="194" width="70" height="58" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="489" y="233" font-family="sans-serif" font-size="27" fill="#173d4e" text-anchor="middle" font-weight="normal">4</text>
<text x="489" y="282" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="middle" font-weight="normal">True</text>
<rect x="538" y="194" width="70" height="58" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="573" y="233" font-family="sans-serif" font-size="27" fill="#173d4e" text-anchor="middle" font-weight="normal">5</text>
<text x="573" y="282" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="middle" font-weight="normal">True</text>
<rect x="622" y="194" width="70" height="58" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="657" y="233" font-family="sans-serif" font-size="27" fill="#173d4e" text-anchor="middle" font-weight="normal">6</text>
<text x="657" y="282" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="middle" font-weight="normal">True</text>
<rect x="706" y="194" width="70" height="58" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="741" y="233" font-family="sans-serif" font-size="27" fill="#173d4e" text-anchor="middle" font-weight="normal">7</text>
<text x="741" y="282" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="middle" font-weight="normal">True</text>
<text x="454" y="324" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">全部有效</text>
<rect x="844" y="104" width="372" height="258" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="864" y="139" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="start" font-weight="bold">program 2</text>
<text x="864" y="174" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">offsets = 8 + [0, 1, 2, 3]</text>
<rect x="864" y="194" width="70" height="58" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="899" y="233" font-family="sans-serif" font-size="27" fill="#173d4e" text-anchor="middle" font-weight="normal">8</text>
<text x="899" y="282" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="middle" font-weight="normal">True</text>
<rect x="948" y="194" width="70" height="58" rx="9" fill="#edf4f5" stroke="#497789" stroke-width="1.5"/>
<text x="983" y="233" font-family="sans-serif" font-size="27" fill="#173d4e" text-anchor="middle" font-weight="normal">9</text>
<text x="983" y="282" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="middle" font-weight="normal">True</text>
<rect x="1032" y="194" width="70" height="58" rx="9" fill="#edf0ef" stroke="#87989d" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1067" y="233" font-family="sans-serif" font-size="27" fill="#445a62" text-anchor="middle" font-weight="normal">10</text>
<text x="1067" y="282" font-family="sans-serif" font-size="19" fill="#445a62" text-anchor="middle" font-weight="normal">False</text>
<rect x="1116" y="194" width="70" height="58" rx="9" fill="#edf0ef" stroke="#87989d" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1151" y="233" font-family="sans-serif" font-size="27" fill="#445a62" text-anchor="middle" font-weight="normal">11</text>
<text x="1151" y="282" font-family="sans-serif" font-size="19" fill="#445a62" text-anchor="middle" font-weight="normal">False</text>
<text x="864" y="324" font-family="sans-serif" font-size="19" fill="#173d4e" text-anchor="start" font-weight="normal">只读写 8、9；跳过 10、11</text>
<text x="24" y="400" font-family="sans-serif" font-size="23" fill="#173d4e" text-anchor="start" font-weight="bold">mask = offsets &lt; n</text>
<text x="24" y="434" font-family="sans-serif" font-size="21" fill="#173d4e" text-anchor="start" font-weight="normal">tl.load(..., mask=mask, other=0)；tl.store(..., mask=mask)</text>
<text x="24" y="472" font-family="sans-serif" font-size="18" fill="#445a62" text-anchor="start" font-weight="normal">BLOCK 描述逻辑数据片段；这些格子不表示物理线程或 wavefront lane。</text>
</svg>
